name: Release

# Publishing is deliberate, never automatic on a push: the run is started by hand and told which
# version it is releasing, so a merge to master can never ship a package on its own.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being released, e.g. 0.4.0 — must match package.json'
        required: true
        type: string

permissions:
  # The tag and the GitHub release are created by this run, not by hand afterwards.
  contents: write
  # npm trusted publishing (OIDC): GitHub mints a short-lived identity token, so no npm token is
  # stored in this repository. See ADR-0006.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 carries an npm new enough for trusted publishing (needs npm >= 11.5.1 and
      # Node >= 22.14). npm is still upgraded explicitly so the job does not silently regress
      # if the runner image ships an older bundled npm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: npm ci

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # The same gate as CI. A release must not be able to pass on weaker checks than a pull
      # request does.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contrast
      - run: npm run build
      - run: npm run build-storybook
      - run: npm run check:package

      # Publishing the wrong version is not recoverable — npm never lets a version number be
      # reused — so the manifest has to agree with what the operator typed before anything is
      # sent to the registry.
      # The operator's input reaches the shell through the environment, never through template
      # expansion into the script body: an expanded `${{ }}` is text spliced into the program
      # before the shell ever sees it, which is how a workflow input becomes a command.
      - name: Verify the version matches package.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MANIFEST_VERSION="$(node -p "require('./package.json').version")"
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "package.json is $MANIFEST_VERSION but the run requested $VERSION" >&2
            exit 1
          fi

      # The release notes are read before publishing, so a missing or empty changelog section stops
      # the run while stopping is still free. npm never lets a version number be reused.
      - name: Collect the release notes
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > /tmp/release-notes.md

      # The tag goes up before the publish, and the order is the whole point.
      #
      # Publishing is the one step here that cannot be undone: npm never lets a version number be
      # reused. Tagging can be undone with `git push origin :refs/tags/vX.Y.Z`. So the recoverable
      # step goes first — if tagging fails, nothing has been published and the run can simply be
      # started again; if publishing fails, the leftover tag is deleted and the run is started
      # again. Publishing first meant a failed tag push left a version in the registry that could
      # never be republished, and that ordering was not a decision: these steps were appended to
      # the end of a workflow that already ended in `npm publish`.
      - name: Tag the released commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - run: npm publish

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
