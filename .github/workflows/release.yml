name: Release

# Publishing is deliberate, never automatic on a push: the run is started by hand and told which
# version it is releasing, so a merge to master can never ship a package on its own.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being released, e.g. 0.4.0 — must match package.json'
        required: true
        type: string

permissions:
  # The tag and the GitHub release are created by this run, not by hand afterwards.
  contents: write
  # npm trusted publishing (OIDC): GitHub mints a short-lived identity token, so no npm token is
  # stored in this repository. See ADR-0006.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # `workflow_dispatch` accepts any ref, and the workflow file only has to exist on the default
      # branch for the button to appear — so without this the run could be started against a feature
      # branch and publish whatever happened to be on it. `RELEASES.md` requires a release to come
      # from a clean, verified protected branch; this is that requirement, executed rather than
      # written down. The check is first because everything after it costs minutes.
      - name: Refuse to release from anything but master
        if: github.ref != 'refs/heads/master'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "A release runs from master. This run was dispatched against $REF." >&2
          echo "Merge the release branch first; the tag is cut from the commit that master holds." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 carries an npm new enough for trusted publishing (needs npm >= 11.5.1 and
      # Node >= 22.14). npm is still upgraded explicitly so the job does not silently regress
      # if the runner image ships an older bundled npm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: npm ci

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # The same gate as CI, step for step and in the same order. That parity is the point: a
      # release is the one irreversible action in this project, and for a while it ran on a
      # shorter list than an ordinary pull request did — it skipped `check:css`, `check:consumer`,
      # `check:workbench` and `check:browser`, which are exactly the four that cross the package
      # boundary or need a real browser. The cheapest checks stay first so a failure is cheap.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contrast
      - run: npm run build
      - run: npm run build-storybook

      # Reads the built stylesheets and fails on an un-inlined `@import` or a missing token layer.
      # It has to run after both builds, because both are what it inspects.
      - run: npm run check:css

      # Compares the built exports, package subpaths and `--kreo-*` custom properties against the
      # snapshot in `scripts/public-api.snapshot.json`. Reads `dist`, so it runs after the build.
      - run: npm run check:api

      - run: npm run check:package

      # Packs the package and installs the tarball into two independent applications: the consumer
      # fixture, and the workbench, which is then driven in a real browser. A release that has not
      # been installed from its own tarball has not been tested as a package at all.
      - run: npm run check:consumer
      - run: npm run check:workbench

      # Behaviour the browser owns rather than the DOM — `Escape` on a modal, the focus trap,
      # forced-colors — driven by real key presses against the built Storybook. Chromium is
      # installed above. `check:visual` is deliberately absent here as it is on CI: its baselines
      # are macOS and this runner is Ubuntu, where the same text does not render identically.
      - run: npm run check:browser

      # Publishing the wrong version is not recoverable — npm never lets a version number be
      # reused — so the manifest has to agree with what the operator typed before anything is
      # sent to the registry.
      # The operator's input reaches the shell through the environment, never through template
      # expansion into the script body: an expanded `${{ }}` is text spliced into the program
      # before the shell ever sees it, which is how a workflow input becomes a command.
      - name: Verify the version matches package.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MANIFEST_VERSION="$(node -p "require('./package.json').version")"
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "package.json is $MANIFEST_VERSION but the run requested $VERSION" >&2
            exit 1
          fi

      # The release notes are read before publishing, so a missing or empty changelog section stops
      # the run while stopping is still free. npm never lets a version number be reused.
      - name: Collect the release notes
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > /tmp/release-notes.md

      # The tag goes up before the publish, and the order is the whole point.
      #
      # Publishing is the one step here that cannot be undone: npm never lets a version number be
      # reused. Tagging can be undone with `git push origin :refs/tags/vX.Y.Z`. So the recoverable
      # step goes first — if tagging fails, nothing has been published and the run can simply be
      # started again; if publishing fails, the leftover tag is deleted and the run is started
      # again. Publishing first meant a failed tag push left a version in the registry that could
      # never be republished, and that ordering was not a decision: these steps were appended to
      # the end of a workflow that already ended in `npm publish`.
      - name: Tag the released commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - run: npm publish

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
