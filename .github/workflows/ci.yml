name: CI

on:
  push:
    branches: [master]
  # Deliberately unfiltered: a pull request is checked wherever it is aimed. Restricting this to
  # `master` left stacked pull requests unverified, which is exactly when verification is worth
  # most — the base is itself unreviewed.
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # The browser is keyed on the lockfile because that is what pins the Playwright version:
      # a stale browser against a newer Playwright is exactly the mismatch the install guards.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The story tests run in a real browser, which is the only place axe can judge contrast
      # and focus. Only Chromium is installed; the suite does not run cross-browser.
      - run: npx playwright install --with-deps chromium

      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contrast
      - run: npm run build
      - run: npm run build-storybook
      - run: npm run check:package
